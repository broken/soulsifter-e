<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #18181b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #27272a;
    }
    .title-container {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
      margin-right: 16px;
    }
    .badge {
      background: #ef4444;
      color: white;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .query-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #d4d4d8;
      font-weight: 500;
    }
    .query-highlight {
      color: #fafafa;
      font-weight: 600;
    }
    .midi-hint {
      color: #71717a;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      margin-right: 12px;
      background: #27272a;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .midi-hint strong {
      color: #a1a1aa;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    button {
      border: none;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    button:active {
      transform: scale(0.97);
    }
    .btn-audio {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-audio:hover {
      background: #1d4ed8;
    }
    .btn-cancel {
      background: #3f3f46;
      color: #e4e4e7;
    }
    .btn-cancel:hover {
      background: #52525b;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="title-container">
    <span class="badge">Music Video</span>
    <span class="query-text">Select video for: <span id="queryText" class="query-highlight"></span></span>
  </div>
  <div class="actions">
    <span class="midi-hint" id="midiHint"><strong>Browse:</strong> Move &bull; <strong>Load:</strong> Select &bull; <strong>Back:</strong> Cancel &bull; <strong>Forward:</strong> Audio</span>
    <button id="btnAudio" class="btn-audio" onclick="window.location.href='ss-action://load-audio'">Load Audio Only</button>
    <button class="btn-cancel" onclick="window.location.href='ss-action://cancel'">Cancel</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('queryText').textContent = params.get('q') || '';
    if (params.get('audio') !== '1') {
      document.getElementById('btnAudio').style.display = 'none';
    }
  </script>
</body>
</html>
